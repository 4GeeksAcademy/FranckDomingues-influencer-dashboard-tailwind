<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive influencer analytics dashboard for monitoring commissions, conversions, engagement, products, platforms, and campaigns."
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Influencer Analytics Dashboard</title>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <div class="mx-auto flex min-h-screen max-w-4xl flex-col px-4 py-8 sm:px-6 lg:px-8">
      <!-- Dashboard Header: Intro content sets page purpose for screen readers and search metadata consistency. -->
      <header class="mb-8">
        <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">
          Influencer Analytics Dashboard
        </h1>
        <p class="mt-3 text-base text-slate-600 sm:text-lg">
          Performance overview across products, platforms, and campaigns.
        </p>
      </header>

      <!-- Main Content: Placeholder keeps semantic structure while detailed dashboard modules are added later. -->
      <main class="flex-1">
        <!-- Dashboard sections will be added progressively. -->
      </main>

      <!-- Dashboard Footer: Attribution remains visually secondary but consistently available at page end. -->
      <footer class="mt-10 border-t border-slate-200 pt-4">
        <p class="text-sm text-slate-600">
          Built by Francisco Garcia as part of the 4Geeks Academy AI Engineering
          program.
        </p>
      </footer>
    </div>
  </body>
</html>
